name: CI

# Her branch'e yapılan her push'ta ve her PR'da çalışır.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # AI ajanını sınırlayan hook'ların kendisi de test edilir (sahte bir proje kopyasında).
      - name: Hook testleri
        run: python3 .claude/hooks/tests/hooktest.py

      # Yerelde aynısı: mvn -B verify (ci-build skill'i)
      - name: Build ve testler
        run: mvn -B verify

name: Claude PR Review

# Yereldeki code-reviewer ajanının kurallarını her PR'da tekrar uygular.
# Yerel kontrolü atlayan (veya AI kullanılmadan yazılan) değişiklikler de incelenmiş olur.
# Gerekli secret: ANTHROPIC_API_KEY (repo Settings → Secrets and variables → Actions)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Bu PR'ı incele. İnceleme kuralların ve rapor formatın .claude/agents/code-reviewer.md
            dosyasında; önce onu ve .claude/skills/architecture-guard/SKILL.md dosyasını oku.
            Değişiklikleri `gh pr diff` ile al. Dosya değiştirme.
            Somut bulguları ilgili satıra inline yorum olarak yaz; sonunda `gh pr comment` ile
            tek bir özet yorum bırak (bulgu listesi + ONAY/RED kararı).
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

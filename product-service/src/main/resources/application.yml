server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Auth Mikroservisinin Adresi (.NET appsettings.json içindeki ServiceUrls:AuthService karşılığı)
services:
  auth:
    base-url: http://localhost:8081
